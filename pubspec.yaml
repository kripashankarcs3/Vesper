name: wa_shield
description: "Vesper - offline, privacy-first companion for WhatsApp: deleted-message recovery, media backup and status saver in an encrypted vault."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite_sqlcipher: ^3.1.0+1          # AES-256 Encrypted SQLite
  flutter_secure_storage: ^9.2.2       # Android Hardware Keystore
  local_auth: ^2.3.0                   # Fingerprint / Face / PIN Lock
  path_provider: ^2.1.2
  path: ^1.9.0
  permission_handler: ^11.3.0
  intl: ^0.19.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_mark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_1024.png"
  adaptive_icon_background: "#0B141A"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  remove_alpha_ios: true
